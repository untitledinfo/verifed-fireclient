name: Sign FireClient Setup and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.2.3'
        required: true
        type: string
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sign-and-release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select and validate release version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            $version = $env:REF_NAME -replace '^v', ''
          } else {
            $version = $env:INPUT_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "Invalid version '$version'. Use a version like 1.2.3 or 1.2.3-rc.1."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $files = @(
            (Join-Path $PWD 'scripts/Sign-And-Generate-Yml.ps1'),
            (Join-Path $PWD 'scripts/Verify-Windows-Release.ps1')
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error ("PowerShell parse error in {0} at line {1}: {2}" -f $file, $_.Extent.StartLineNumber, $_.Message) }
              exit 1
            }
            Write-Host "Syntax passed: $file"
          }

      - name: Sign executable and generate latest.yml
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # TEST RELEASES ONLY: never presents the self-signed cert as trusted.
          ALLOW_UNTRUSTED_SELF_SIGNED_CERTIFICATE: 'true'
          EXPECTED_SIGNING_CERT_THUMBPRINT: 'BDF35D4B69863EB70590708C44D11E18C12AF2C5'
        run: ./scripts/Sign-And-Generate-Yml.ps1

      - name: Report publisher identity and scan installer with Microsoft Defender
        shell: pwsh
        env:
          ALLOW_UNTRUSTED_SELF_SIGNED_CERTIFICATE: 'true'
          EXPECTED_SIGNING_CERT_THUMBPRINT: 'BDF35D4B69863EB70590708C44D11E18C12AF2C5'
        run: ./scripts/Verify-Windows-Release.ps1

      - name: Upload release files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FireClient-release-${{ env.RELEASE_VERSION }}
          path: |
            dist/FireClient-Setup.exe
            dist/latest.yml
            dist/verification-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          name: FireClient ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/FireClient-Setup.exe
            dist/latest.yml
            dist/verification-report.json
